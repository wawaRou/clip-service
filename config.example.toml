# 完整配置示例：除 Frigate 地址及摄像头标识外，下面启用的值均为默认值。
# 优先级：受支持的环境变量 > 本文件 > 内置默认值。
# 相对路径以本文件所在目录为基准，支持 ~。
# 模型、server、data_dir、retention_hours 修改后需要重启；摄像头和检测配置可显式重载。
data_dir = "data" # 候选图片和状态保存目录；环境变量 CLIP_DATA_DIR。
retention_hours = 24.0 # 候选自创建起的保留时间（小时），> 0；与 ack_timeout_seconds 分开。

[server]
host = "127.0.0.1" # HTTP / SSE 监听地址。
port = 18080 # 监听端口，1–65535。

[model]
id = "openai/clip-vit-base-patch16" # 从 Hugging Face 默认缓存查找模型。
# 仅离线读取：未缓存或文件不完整时，加载失败，不联网下载。
# 遵循 Hugging Face 的 HF_HOME / HF_HUB_CACHE 环境变量。
# 可选：指定模型目录时优先使用 path，忽略 id；不要指向整个 hub 缓存根目录。
# path = "~/models/clip" # 也可填写具体 snapshots/<版本> 目录；CLIP_MODEL_PATH 可覆盖。
device = "auto" # auto / cpu / cuda / mps；auto 优先 MPS，其次 CUDA，最后 CPU；CLIP_DEVICE。
precision = "fp32" # fp32：所有后端；tf32：CUDA；fp16：CUDA 或 MPS。

[frigate]
rtsp_base_url = "rtsp://frigate.local:8554" # 必填；CLIP_FRIGATE_URL 可覆盖。
# 可选认证；不需要认证时省略。禁止在上面的 URL 中嵌入用户名或密码。
# username = "viewer" # 建议使用环境变量 CLIP_FRIGATE_USERNAME。
# password = "your-password" # 建议使用环境变量 CLIP_FRIGATE_PASSWORD。

[detection]
# 以下均为各摄像头共享的默认值，可在各自的 cameras 表中覆盖。
inference_fps = 8 # 每路目标检测 FPS，> 0；实际速率取决于硬件和视频帧率。
similarity_threshold = 0.9 # 相似度阈值，[-1, 1]。
stable_seconds = 0.3 # 变化持续确认时间（秒），>= 0 且小于 ring_seconds。
candidate_frame_interval = 0.075 # 候选五帧间隔（秒），至少为 1 / ring_max_fps。
candidate_frame_count = 5 # 当前协议固定为 5，不支持其他值。
ring_seconds = 7.0 # 短时帧缓存跨度（秒），> 0，必须大于候选五帧的总跨度。
ring_max_fps = 30.0 # 缓存采样 FPS 上限，> 0。
frame_window_max_distance_seconds = 0.5 # 仅 frame-windows 接口的选帧容差（秒），>= 0。
jpeg_quality = 85 # JPEG 质量，1–100。
open_timeout_seconds = 3.0 # 打开视频流超时（秒），> 0。
read_timeout_seconds = 3.0 # 读取视频帧超时（秒），> 0。
reconnect_delay_seconds = 1.0 # 断流后重连间隔（秒），> 0。
frame_max_age_seconds = 1.0 # 检测允许的最大帧龄（秒），> 0。
ack_timeout_seconds = 60.0 # 候选等待回执的超时（秒），> 0。

# 每个 cameras.<标识> 对应一路摄像头；标识和 stream 请换成实际值。
# stream 是上述 Frigate 的 go2rtc 流名，不接受第三方视频源地址。
# 可任意增删摄像头表；删除所有摄像头表即可空配置启动，不会自动添加摄像头。
[cameras.front_door]
stream = "front_door_sub" # 每路必填。
enabled = true # 是否启用，默认 true。
# 可覆盖 [detection] 中的任意同名项；省略则继承全局默认。
# inference_fps = 8
# similarity_threshold = 0.9
# stable_seconds = 0.3
