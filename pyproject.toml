[project]
name = "clip-service"
version = "0.1.0"
description = "Cross-platform CLIP visual change detection service"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "opencv-python-headless>=4.11,<5",
    "pydantic>=2.10,<3",
    "tomli>=2,<3 ; python_full_version < '3.11'",
]

[project.optional-dependencies]
# Mac starts with the torch version present in the original project's environment.
mac = ["torch==2.13.0 ; sys_platform == 'darwin'"]
thor = [
    "torch==2.14.0+cu132 ; sys_platform == 'linux' and python_version == '3.12'",
    "torchvision==0.29.0+cu132 ; sys_platform == 'linux' and python_version == '3.12'",
]
orin = [
    "torch==2.8.0 ; sys_platform == 'linux' and python_version == '3.10'",
    "torchvision==0.23.0 ; sys_platform == 'linux' and python_version == '3.10'",
]

[dependency-groups]
dev = [
    "pyright>=1.1,<2",
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[project.scripts]
clip-service = "clip_service.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.uv]
conflicts = [[{ extra = "mac" }, { extra = "thor" }, { extra = "orin" }]]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64' and python_version == '3.12'",
    "sys_platform == 'linux' and platform_machine == 'aarch64' and (python_version == '3.10' or python_version == '3.12')",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu132", extra = "thor" },
    { index = "jetson-cu126", extra = "orin" },
]
torchvision = [
    { index = "pytorch-cu132", extra = "thor" },
    { index = "jetson-cu126", extra = "orin" },
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "jetson-cu126"
url = "https://pypi.jetson-ai-lab.io/jp6/cu126"
explicit = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
include = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
typeCheckingMode = "basic"
